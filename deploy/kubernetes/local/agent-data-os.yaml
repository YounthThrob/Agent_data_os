apiVersion: v1
kind: Namespace
metadata:
  name: agent-data-os
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-data-os-api
  namespace: agent-data-os
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-data-os-api
  namespace: agent-data-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-data-os-api
  template:
    metadata:
      labels:
        app: agent-data-os-api
    spec:
      serviceAccountName: agent-data-os-api
      containers:
        - name: api
          image: agent-data-os:local
          imagePullPolicy: Never
          env:
            - name: ADOS_ENVIRONMENT
              value: development
            - name: ADOS_ALLOW_INSECURE_DEV_AUTH
              value: "true"
            - name: ADOS_DATABASE_AUTO_CREATE
              value: "false"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: agent-data-os-api
  namespace: agent-data-os
spec:
  selector:
    app: agent-data-os-api
  ports:
    - name: http
      port: 8000
      targetPort: http
