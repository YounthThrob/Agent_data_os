[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-data-os"
version = "0.1.0"
description = "Agent Data OS V1.0 backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
  "SQLAlchemy>=2.0.51,<3.0",
  "alembic>=1.19,<2.0",
  "psycopg[binary]>=3.3.4,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=7.0,<9.0",
  "pytest-cov>=6.3,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agent_data_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
